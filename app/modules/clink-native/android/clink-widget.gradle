// Widget dependencies and test setup, shared by the Expo module (build.gradle) and the standalone
// harness (standalone/build.gradle). Versions: latest stable at build time (ARCHITECTURE.md 1:
// Glance minimum 1.1). Kotlin and Compose compiler versions come from the React Native template.

// app/modules/clink-native/android, wherever this file is applied from.
def moduleDir = project.ext.has('clinkModuleDir') ? file(project.ext.clinkModuleDir) : projectDir

android {
  sourceSets {
    main {
      // Generated by scripts/gen-android-strings.mjs, gen-android-colors.mjs, gen-drink-assets.mjs.
      res.srcDirs += [file("${moduleDir}/../../../assets/native/android/res")]
    }
  }
  testOptions {
    unitTests {
      includeAndroidResources = true
      all {
        // The shared fixtures every port decodes (packages/shared/fixtures).
        systemProperty 'clink.fixtures', file("${moduleDir}/../../../../packages/shared/fixtures").absolutePath
        // Where the render test writes PNGs; unset means "don't write".
        if (project.hasProperty('clinkScreens')) systemProperty 'clink.screens', project.property('clinkScreens')
        if (project.hasProperty('clinkPreviews')) systemProperty 'clink.previews', project.property('clinkPreviews')
        maxHeapSize = '2g'
      }
    }
  }
}

dependencies {
  implementation 'androidx.glance:glance-appwidget:1.2.0'
  implementation 'androidx.work:work-runtime-ktx:2.11.2'
  implementation 'androidx.datastore:datastore-preferences:1.2.1'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16'
  testImplementation 'androidx.test:core:1.6.1'
  testImplementation 'androidx.glance:glance-appwidget-testing:1.2.0'
  testImplementation 'androidx.work:work-testing:2.11.2'
  testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}
